[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakuri"
version = "0.1.0"
description = "Star-seeker: learn from public development in AI agents, biology and bioinformatics"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pakuri = "pakuri.__main__:main"

[tool.setuptools.packages.find]
include = ["pakuri*"]
