[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakuri"
version = "0.1.0"
description = "Private, local observer of public GitHub development metadata"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pakuri = "pakuri.__main__:main"

[tool.setuptools.packages.find]
include = ["pakuri*"]
